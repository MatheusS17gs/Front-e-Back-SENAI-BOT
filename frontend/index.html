<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SENAI-GPT</title>
    <!-- Ícones do FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Arquivo CSS Externo -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Faixa Lateral Vermelha -->
    <div class="sidebar"></div>

    <!-- Container Conteúdo -->
    <div class="main-container">
        
        <!-- Botões do Canto Superior Direito -->
        <div class="top-controls">
            <!-- Botão Alternar Tema (Claro/Escuro) -->
            <button class="icon-btn" id="themeToggleBtn" title="Alternar Tema Claro/Escuro">
                <i class="fa-solid fa-moon"></i>
            </button>
            
            <!-- Botão de registro -->
            <button class="register-btn" id="loginBtn" title="Register">
                Register
            </button>
        </div>

        <!-- Bloco Central -->
        <div class="content">
            <img
                src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Crect width='120' height='120' rx='24' fill='%23e31d3b'/%3E%3Ccircle cx='60' cy='50' r='28' fill='%23ffffff'/%3E%3Crect x='26' y='70' width='68' height='28' rx='14' fill='%23ffffff'/%3E%3Ccircle cx='48' cy='50' r='4' fill='%23e31d3b'/%3E%3Ccircle cx='72' cy='50' r='4' fill='%23e31d3b'/%3E%3Cpath d='M48 62 Q60 72 72 62' stroke='%23e31d3b' stroke-width='4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E"
                alt="Logo SENAI-GPT"
                class="robot-avatar"
            >

            <!-- Título -->
            <h1 class="title">SENAI-GPT</h1>

            <div class="chat-window" id="chatMessages" aria-live="polite"></div>

            <!-- Input do Chat -->
            <div class="input-wrapper">
                <input type="text" id="userInput" class="chat-input" placeholder="Pergunte algo..." autocomplete="off">
                <button class="send-btn" id="sendBtn" title="Enviar">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>

            <!-- Logo SENAI -->
            <div class="senai-logo">
                SENAI
            </div>
        </div>
    </div>

    <!-- Modal de Login -->
    <div class="modal" id="loginModal">
        <div class="modal-content">
            <span class="close-modal" id="closeModal">&times;</span>
            <h2>Área de Login</h2>
            <form id="loginForm">
                <input type="email" placeholder="E-mail" required>
                <input type="password" placeholder="Senha" required>
                <button type="submit">Entrar</button>
            </form>
        </div>
    </div>

    <!-- JAVASCRIPT -->
    <script src="script.js"></script>
</body>
</html>
